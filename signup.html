<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Manager — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aurora">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<main class="card">
  <div class="logo-row">
    <svg class="logo-mark" viewBox="0 0 40 40" fill="none">
      <path d="M20 4 6 15v21h10V25h8v11h10V15L20 4Z" fill="url(#g1)"/>
      <defs>
        <linearGradient id="g1" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5fe0c2"/>
          <stop offset="1" stop-color="#3d7bd6"/>
        </linearGradient>
      </defs>
    </svg>
    <span class="logo-text">Rental Manager</span>
  </div>

  <h1>Create Account</h1>
  <p class="sub">Sign up for a free account to get started.</p>

  <form id="signupForm" novalidate>
    <div class="two-col">
      <div class="group">
        <label for="fname">First Name</label>
        <div class="field plain">
          <input type="text" id="fname" placeholder="e.g., John">
        </div>
      </div>
      <div class="group">
        <label for="lname">Second Name <span class="optional">(Optional)</span></label>
        <div class="field plain">
          <input type="text" id="lname" placeholder="e.g., Doe">
        </div>
      </div>
    </div>

    <div class="group">
      <label for="semail">Work Email</label>
      <div class="field">
        <span class="icon-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z" stroke-linecap="round" stroke-linejoin="round"/><path d="m22 6-10 5L2 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input type="email" id="semail" placeholder="e.g., john.doe@rentalmanager.com" autocomplete="username">
        <span class="icon-right status-icon" id="semailStatus"></span>
      </div>
      <p class="hint" id="semailMsg"></p>
    </div>

    <div class="group">
      <label for="spw">Password</label>
      <div class="field">
        <span class="icon-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input type="password" id="spw" placeholder="Create a password" autocomplete="new-password">
        <button type="button" class="show-toggle" id="spwToggle" onclick="togglePw('spw','spwToggle')">Show</button>
      </div>
      <p class="hint" id="pwHint">Must be at least 8 characters</p>
      <div class="pw-checklist" id="pwChecklist">
        <div class="rule" data-rule="upper"><span class="dot"></span>Uppercase letter</div>
        <div class="rule" data-rule="num"><span class="dot"></span>Number</div>
        <div class="rule" data-rule="special"><span class="dot"></span>Special character</div>
      </div>
    </div>

    <div class="group">
      <label for="cpw">Confirm Password</label>
      <div class="field">
        <span class="icon-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input type="password" id="cpw" placeholder="Re-enter your password" autocomplete="new-password">
        <button type="button" class="show-toggle" id="cpwToggle" onclick="togglePw('cpw','cpwToggle')">Show</button>
        <span class="icon-right status-icon" id="cpwStatus" style="right:56px"></span>
      </div>
      <p class="hint" id="cpwMsg"></p>
    </div>

    <label class="remember terms">
      <input type="checkbox" id="terms">
      <span>I agree to the <a href="#" class="link-mint">Terms of Service</a> and <a href="#" class="link-mint">Privacy Policy</a>.</span>
    </label>

    <button class="btn-solid" type="submit" id="submitBtn" disabled>Create Account</button>
  </form>

  <div class="divider">or continue with</div>

  <button class="btn-outline" type="button" aria-label="Continue with Google">
    <svg class="google-logo" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c10.9 0 20-8.9 20-20 0-1.3-.1-2.6-.4-3.9z" fill-rule="evenodd"/><path fill="#EA4335" d="M9.1 17.3l-4.3-3.2C3.1 12.7 2 14.8 2 17v14c0 2.2 1.1 4.3 2.8 5.5l5.6-4.3c-1.2-1.5-1.8-3.3-1.8-5.2s.6-3.7 1.8-5.2z" fill-rule="evenodd"/><path fill="#34A853" d="M24 44c5.2 0 9.9-1.8 13.6-4.8l-5.6-4.3c-1.8 1.2-4 2-6.4 2-4.9 0-9.1-3.3-10.6-7.8l-5.6 4.3c2.9 4.6 7.9 7.6 13.6 7.6z" fill-rule="evenodd"/><path fill="#FBBC05" d="M43.6 20.1c.2.6.3 1.3.3 2-.2 4.9-2.1 9.4-5.3 12.8l5.6 4.3c3.2-2.9 5.3-7.1 5.3-11.8 0-1.4-.2-2.8-.5-4.1h-19V24h11.6z" fill-rule="evenodd"/></svg>
    Continue with Google
  </button>

  <p class="foot-note">Already have an account? <a href="index.html">Log in here</a></p>
</main>

<span class="keyhole" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="9" r="4"/><path d="M12 13v6l-2 2M12 19l2 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span>

<script src="script.js"></script>
</body>
</html>
