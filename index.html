<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Manager — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aurora">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<main class="card">
  <div class="logo-row">
    <svg class="logo-mark" viewBox="0 0 40 40" fill="none">
      <path d="M20 4 6 15v21h10V25h8v11h10V15L20 4Z" fill="url(#g1)"/>
      <defs>
        <linearGradient id="g1" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5fe0c2"/>
          <stop offset="1" stop-color="#3d7bd6"/>
        </linearGradient>
      </defs>
    </svg>
    <span class="logo-text">Rental Manager</span>
  </div>

  <h1>Account Login</h1>
  <p class="sub">Sign in to access your dashboard</p>

  <form id="loginForm" novalidate>
    <div class="group">
      <label for="email">Work Email</label>
      <div class="field">
        <span class="icon-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z" stroke-linecap="round" stroke-linejoin="round"/><path d="m22 6-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input type="email" id="email" placeholder="user@rentalmanager.com" autocomplete="username">
        <span class="icon-right status-icon" id="emailStatus"></span>
      </div>
      <p class="hint" id="emailMsg"></p>
    </div>

    <div class="group">
      <label for="pw">Password</label>
      <div class="field">
        <span class="icon-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input type="password" id="pw" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" class="show-toggle" id="pwToggle" onclick="togglePw('pw','pwToggle')">Show</button>
      </div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember">
        <span>Remember me</span>
      </label>
      <a href="forgot-password.html" class="link-mint">Forgot Password?</a>
    </div>

    <button class="btn-solid" type="submit" id="submitBtn" disabled>Sign In</button>
  </form>

  <div class="divider">or continue with</div>

  <button class="btn-outline" type="button">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8.9 20-20 0-1.3-.1-2.6-.4-4z"/></svg>
    Continue with Google
  </button>

  <a href="signup.html" class="btn-outline btn-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Create Account
  </a>

  <p class="foot-note">Need an account? <a href="signup.html">Sign up here</a></p>
</main>

<span class="keyhole" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="9" r="4"/><path d="M12 13v6l-2 2M12 19l2 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span>

<script src="script.js"></script>
</body>
</html>
